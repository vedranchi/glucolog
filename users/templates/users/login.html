{% extends "users/auth_base.html" %}

{% block title %}Sign in | GlucoLog{% endblock %}

{% block card %}
<h1>Welcome back.</h1>
<p class="auth-note">Sign in to pick up today's log.</p>

<form method="POST" class="auth-form">
  {% csrf_token %}
  {% include "users/_form_fields.html" %}
  <button type="submit" class="btn btn-primary btn-full">Sign in</button>
</form>

<div class="auth-links">
  <p>New here? <a href="{% url 'glucolog-register' %}">Create an account</a></p>
  <p>Forgot your password? <a href="{% url 'password_reset' %}">Reset it</a></p>
</div>
{% endblock %}
