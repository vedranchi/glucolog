{% extends "users/auth_base.html" %}

{% block title %}Reset password | GlucoLog{% endblock %}

{% block card %}
<h1>Reset your password.</h1>
<p class="auth-note">Enter your account email and we will send you a reset link.</p>

<form method="post" class="auth-form">
  {% csrf_token %}
  {% include "users/_form_fields.html" %}
  <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
</form>

<div class="auth-links">
  <p><a href="{% url 'glucolog-login' %}">Back to sign in</a></p>
</div>
{% endblock %}
