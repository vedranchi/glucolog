{% extends 'main/base.html' %}
{% load static %}

{% block title %}Password Updated — GlucoLog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/auth.css' %}" />
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Password Updated</h2>
    <p class="auth-note">
      Your password has been set successfully. You can sign in now.
    </p>
    <div class="back-link">
      <a href="{% url 'glucolog-login' %}">Go to Login</a>
    </div>
  </div>
</div>
{% endblock %}
