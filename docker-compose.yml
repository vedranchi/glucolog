services:
  db:
    image: postgres:17
    container_name: glucolog_db_dev
    env_file: .env

    # Host port publishing for local dev lives in docker-compose.override.yml
    # (auto-loaded by `docker compose up`). Production omits it so Postgres is
    # never exposed on the public VM.

    environment:

      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - glucolog_postgres_dev:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  glucolog_postgres_dev:
