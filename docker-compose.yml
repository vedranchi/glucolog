services:
  db:
    image: postgres:17
    container_name: glucolog_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
    - glucolog_postgres_dev:/var/lib/postgresql/data

volumes:
  glucolog_postgres_dev:
