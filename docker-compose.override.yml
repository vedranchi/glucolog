# Auto-loaded by `docker compose up` in LOCAL DEV only. Publishes Postgres to the
# host (bound to localhost) for local tooling/inspection. Production runs with
# explicit `-f docker-compose.yml -f docker-compose.prod.yml`, which does NOT load
# this file — so the database is never exposed on the public VM.

services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
