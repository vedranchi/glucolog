# Test every change, and on `dev` publish a ready-to-run image to GHCR.
#
# The VM is a 1 GB Oracle free-tier box; building there takes ~8 minutes of
# IO-starved grinding next to the live database. So the VM never builds — CI
# does, on a 4-core runner, and the VM only pulls. See deploy/README.md.
name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: glucolog
          POSTGRES_USER: glucolog
          POSTGRES_PASSWORD: glucolog
        options: >-
          --health-cmd "pg_isready -U glucolog -d glucolog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # settings.py deliberately fails fast without these. Throwaway CI values —
      # they never touch production.
      SECRET_KEY: ci-only-not-a-real-secret-key
      DATABASE_URL: postgres://glucolog:glucolog@localhost:5432/glucolog
      DEBUG: "False"
      # DEBUG=False switches SECURE_SSL_REDIRECT on, which 301s every test-client
      # request before it ever reaches a view. CI speaks plain http, so pin it off
      # rather than running the suite under DEBUG=True and diverging from prod.
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match the Dockerfile. Local dev runs 3.14; the deployed interpreter
          # is 3.13, and CI is the only place that gap gets exercised.
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Collect static files
        # Under DEBUG=False the staticfiles storage is WhiteNoise's manifest
        # backend, which raises "Missing staticfiles manifest entry" for every
        # {% static %} tag until collectstatic has run. The container does this
        # at boot; CI has to do it too, or 27 of the 44 tests error out.
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test --verbosity=2

  build:
    name: Build image
    needs: test
    # Runs everywhere so a broken Dockerfile fails on the PR rather than after
    # the merge, when the deploy is already expected to happen. Only `dev`
    # actually publishes — see `push:` below.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/dev'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,format=long

      - name: Build, and push only from dev
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persist the pip layer between runs so an unchanged requirements.txt
          # does not reinstall 26 packages every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
